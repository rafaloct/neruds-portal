# Development edge proxy for the isolated NERUDS copy.
#
# The web service stays exclusively on the Compose `internal` network, which
# has no external egress. Docker 28 does not wire host port publishing for
# containers attached only to an internal network, so this minimal nginx
# receives the loopback-only published port and proxies to `web` internally.
# `web` and `db` remain without external connectivity; only this proxy also
# sits on the `edge` bridge.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    # Match PHP post_max_size of the development recipe.
    client_max_body_size 36m;

    location / {
        set $neruds_upstream http://web:80;
        proxy_pass $neruds_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
