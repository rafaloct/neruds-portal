name: 'Bico do Papagaio — Trama e Barro'
type: theme
description: 'Tema decolonial para o NERUDS/UFT. Estética da Trama e do Barro — honrando a terra, a resistência e a cultura do Norte do Tocantins.'
package: 'Custom'
version: '1.0.0'
core_version_requirement: ^11 || ^12

base theme: olivero

# Regiões (compatível com Olivero)
regions:
  header: 'Header'
  primary_menu: 'Menu Principal'
  secondary_menu: 'Menu Secundário'
  hero: 'Hero (largura total)'
  highlighted: 'Destacado'
  breadcrumb: 'Trilha de navegação'
  social_bar: 'Barra Social'
  content_above: 'Acima do Conteúdo'
  content: 'Conteúdo'
  sidebar: 'Barra Lateral'
  content_below: 'Abaixo do Conteúdo'
  footer_top: 'Rodapé Superior'
  footer_bottom: 'Rodapé Inferior'

# Bibliotecas globais
libraries:
  - bico_papagaio/bootstrap
  - bico_papagaio/fonts
  - bico_papagaio/global
  - bico_papagaio/hero

dependencies:
  - olivero
