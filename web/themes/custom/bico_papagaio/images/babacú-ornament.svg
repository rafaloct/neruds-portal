  <ellipse cx="40" cy="98" rx="8" ry="9" fill="#C4714A" opacity="0.5"/>

  <!-- Folhas do babaçu (pennate) -->
  <!-- Folha esquerda superior -->
  <path d="M40 60 C20 50 5 35 8 20" stroke="#2E4632" stroke-width="2.5"/>
  <path d="M25 52 C22 45 18 40 15 36" stroke="#3D6142" stroke-width="1.2" opacity="0.7"/>
  <path d="M18 46 C15 40 12 35 10 32" stroke="#3D6142" stroke-width="1.2" opacity="0.7"/>

  <!-- Folha direita superior -->
  <path d="M40 60 C60 50 75 35 72 20" stroke="#2E4632" stroke-width="2.5"/>
  <path d="M55 52 C58 45 62 40 65 36" stroke="#3D6142" stroke-width="1.2" opacity="0.7"/>
  <path d="M62 46 C65 40 68 35 70 32" stroke="#3D6142" stroke-width="1.2" opacity="0.7"/>

  <!-- Folha central -->
  <path d="M40 60 C38 45 39 30 40 15" stroke="#2E4632" stroke-width="2.5"/>
  <path d="M37 48 C32 43 28 39 24 37" stroke="#3D6142" stroke-width="1.2" opacity="0.7"/>
  <path d="M43 48 C48 43 52 39 56 37" stroke="#3D6142" stroke-width="1.2" opacity="0.7"/>
  <path d="M38 38 C33 33 29 29 26 27" stroke="#3D6142" stroke-width="1.0" opacity="0.6"/>
  <path d="M42 38 C47 33 51 29 54 27" stroke="#3D6142" stroke-width="1.0" opacity="0.6"/>

  <!-- Folha esquerda baixa -->
  <path d="M40 65 C22 62 8 55 5 42" stroke="#2E4632" stroke-width="2"/>
  <path d="M25 63 C20 58 16 54 12 52" stroke="#3D6142" stroke-width="1" opacity="0.6"/>

  <!-- Folha direita baixa -->
  <path d="M40 65 C58 62 72 55 75 42" stroke="#2E4632" stroke-width="2"/>
  <path d="M55 63 C60 58 64 54 68 52" stroke="#3D6142" stroke-width="1" opacity="0.6"/>

  <!-- Ornamento geométrico — trama na base -->
  <path d="M28 112 L40 108 L52 112" stroke="#E1C16E" stroke-width="1.5" opacity="0.8"/>
  <path d="M32 115 L40 112 L48 115" stroke="#E1C16E" stroke-width="1" opacity="0.5"/>
