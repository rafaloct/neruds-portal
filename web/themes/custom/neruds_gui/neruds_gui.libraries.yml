# ========================================================================
# NERUDS-GUI Theme Libraries
# Design System Premium com Glassmorphism e Micro-animações
# ========================================================================

# 1. Design System — Tokens de Design
design-system:
  css:
    theme:
      css/tokens/design-tokens.css: { weight: -20 }
      css/tokens/colors.css: { weight: -19 }
      css/tokens/typography.css: { weight: -18 }
      css/tokens/spacing.css: { weight: -17 }
      css/tokens/effects.css: { weight: -16 }
  dependencies:
    - core/drupal

# 2. Bootstrap 5.3 (CDN)
bootstrap5:
  css:
    theme:
      'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css':
        type: external
        minified: true
  js:
    'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js':
      type: external
      minified: true
      attributes:
        defer: true

# 3. Tipografias Premium
fonts:
  css:
    theme:
      # Zilla Slab — Títulos
      'https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&display=swap':
        type: external
        preprocess: false
        attributes:
          media: all
      # Outfit — Body text
      'https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap':
        type: external
        preprocess: false
        attributes:
          media: all
      # JetBrains Mono — Dados/Meta
      'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap':
        type: external
        preprocess: false
        attributes:
          media: all

# 4. Estilos Globais
global-styles:
  css:
    theme:
      css/base/reset.css: {}
      css/base/html.css: {}
      css/base/body.css: {}
      css/base/brand-fonts.css: { weight: -25 }
      css/accessibility/wcag-fixes.css: { weight: 30 }
      css/components/layout.css: { weight: -10 }
      css/components/header.css: {}
      css/components/hero.css: {}
      css/components/navigation.css: {}
      css/components/cards.css: {}
      css/components/buttons.css: {}
      css/components/forms.css: {}
      css/components/footer.css: {}
      css/components/views-ux.css: { weight: 10 }
      css/components/responsive-fixes.css: { weight: 15 }
      css/pages/desktop-pro.css: { weight: 20 }
      css/pages/sobre.css: {}
      css/components/academic-listings.css: { weight: 40 }
  js:
    js/academic-filters.js: {}
    js/global.js:
      attributes:
        defer: true
  dependencies:
    - neruds_gui/design-system
    - neruds_gui/bootstrap5
    - neruds_gui/fonts
    - core/drupal
    - core/jquery
    - core/once

# 5. Animações e Micro-interações (Framer Motion equivalent)
animations:
  js:
    js/animations.js:
      attributes:
        defer: true
  dependencies:
    - core/drupal

